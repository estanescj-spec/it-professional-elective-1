{% extends "base.html" %}
{% block title %}Page not found | FreshNest Laundry{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="auth-card error-card">
      <span class="auth-icon"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></span>
      <h1 class="section-title">We couldn't find that page</h1>
      <p class="section-copy">The link may be old, or this order may no longer be available to your account.</p>
      <a class="button button--primary" href="{{ url_for('index') }}">Return to FreshNest</a>
    </div>
  </div>
</section>
{% endblock %}
