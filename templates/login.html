{% extends "base.html" %}

{% block title %}Sign in | FreshNest Laundry{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="auth-card">
      <span class="auth-icon"><i class="fa-regular fa-user" aria-hidden="true"></i></span>
      <h1 class="section-title">Welcome back</h1>
      <p class="section-copy">Sign in to book a pickup or manage FreshNest orders.</p>
      <form class="stacked-form" action="{{ url_for('login_page') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-field">
          <label class="form-label" for="email">Email address</label>
          <input class="form-control" id="email" name="email" type="email" maxlength="254" autocomplete="email" value="{{ email|default('') }}" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="password">Password</label>
          <div class="password-field-wrap">
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="password" data-password-toggle="password">
              <i class="fa-regular fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <button class="button button--primary" type="submit">Sign in <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
      </form>
      <p class="auth-switch">New to FreshNest? <a href="{{ url_for('register') }}">Create Account</a></p>
    </div>
  </div>
</section>
{% endblock %}
